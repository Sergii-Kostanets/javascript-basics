<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adding two numbers</title>
  </head>
  <body>
    <script>
      // Ask for two numbers, then write their sum
      var firstNumber = Number(prompt("Please enter the first number"));
      var secondNumber = Number(prompt("Please enter the second number"));
      // The + operator adds firstNumber and secondNumber.
      document.write(firstNumber + secondNumber);
      // Number() converts the string to a number.
    </script>
  </body>
</html>
