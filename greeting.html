<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greeting</title>
  </head>
  <body>
    <script>
      // Ask for a name, then greet the user
      var firstName = prompt("Please enter your name");
      // The + joins the "Hello, " string with the value stored in firstName.
      document.write("Hello, " + firstName);
    </script>
  </body>
</html>
